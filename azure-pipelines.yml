trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
# Step 1: Install Node
- task: NodeTool@1
  inputs:
    versionSpec: '18.x'
  displayName: 'Install Node.js'

# Step 2: Find absolute path and run npm install
- script: |
    echo "Searching for package.json..."
    # Find the absolute path of the directory containing package.json
    TARGET_DIR=$(find $(Build.SourcesDirectory) -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \;)
    
    echo "Found package.json in absolute path: $TARGET_DIR"
    # Save it as a global pipeline variable
    echo "##vso[task.setvariable variable=RepoRootDir]$TARGET_DIR"
    
    # Navigate and install
    cd "$TARGET_DIR"
    npm install
  displayName: 'Find folder & npm install'

# Step 3: Build
- script: |
    cd "$(RepoRootDir)"
    npm run build
  displayName: 'npm run build'
  env:
    CI: false

# Step 4: Test
- script: |
    cd "$(RepoRootDir)"
    npm test -- --watchAll=false --passWithNoTests
  displayName: 'npm test'
  env:
    CI: true

# Step 5: Publish artifact
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(RepoRootDir)/build'
    ArtifactName: 'react-build'
  displayName: 'Publish Build Artifact'