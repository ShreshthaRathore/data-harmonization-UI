trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
# Step 1: Install Node
- task: NodeTool@1
  inputs:
    versionSpec: '18.x'
  displayName: 'Install Node.js'

# Step 2: Install dependencies
- script: npm install
  workingDirectory: '$(Build.SourcesDirectory)/data-harmonization'
  displayName: 'npm install'

# Step 3: Build
- script: npm run build
  workingDirectory: '$(Build.SourcesDirectory)/data-harmonization'
  displayName: 'npm run build'
  env:
    CI: false

# Step 4: Test
- script: npm test -- --watchAll=false --passWithNoTests
  workingDirectory: '$(Build.SourcesDirectory)/data-harmonization'
  displayName: 'npm test'
  env:
    CI: true

# Step 5: Publish artifact
# This ensures Azure DevOps looks inside the subfolder for the generated 'build' directory
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'data-harmonization/build'
    ArtifactName: 'react-build'
  displayName: 'Publish Build Artifact'