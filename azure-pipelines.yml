trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
# Step 1: Find package.json location
- script: find . -name "package.json" -not -path "*/node_modules/*"
  displayName: 'Find package.json'

# Step 2: Install Node
- task: NodeTool@1
  inputs:
    versionSpec: '18.x'
  displayName: 'Install Node.js'

# Step 3: Install dependencies
- script: npm install
  displayName: 'npm install'

# Step 4: Build
- script: npm run build
  displayName: 'npm run build'
  env:
    CI: false

# Step 5: Test
- script: npm test -- --watchAll=false --passWithNoTests
  displayName: 'npm test'
  env:
    CI: true

# Step 6: Publish artifact
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'build'
    ArtifactName: 'react-build'
  displayName: 'Publish Build Artifact'