trigger:
- feature/data-harmonization

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    npm install --legacy-peer-deps
  displayName: 'Install Dependencies'

- script: |
    npm run build
  displayName: 'Build React App'
